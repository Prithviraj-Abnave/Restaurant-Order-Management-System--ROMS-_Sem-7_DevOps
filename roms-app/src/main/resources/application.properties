spring.application.name=restaurant-order-management-system

# Server Configuration
server.port=8081

# Database Configuration (H2 In-Memory Database for Development)
spring.datasource.url=jdbc:h2:mem:roms_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: Disable Open in View to avoid warnings
spring.jpa.open-in-view=false
