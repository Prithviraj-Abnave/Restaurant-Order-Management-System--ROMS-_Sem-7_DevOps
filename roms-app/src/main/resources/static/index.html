<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMS - Menu Catalogue</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>ROMS</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">Menu Catalogue</a>
                <a href="#" class="nav-item">Active Orders</a>
                <a href="#" class="nav-item">Kitchen Display</a>
                <a href="#" class="nav-item">Alerts</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1>Menu Catalogue</h1>
                <button class="btn btn-primary" onclick="openModal()">+ Add New Item</button>
            </header>

            <div class="filters">
                <input type="text" id="searchInput" placeholder="Search items..." class="form-input" onkeyup="filterItems()">
                <select id="categoryFilter" class="form-select" onchange="filterItems()">
                    <option value="">All Categories</option>
                    <option value="STARTER">Starter</option>
                    <option value="MAIN_COURSE">Main Course</option>
                    <option value="DESSERT">Dessert</option>
                    <option value="BEVERAGE">Beverage</option>
                </select>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Price (₹)</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="menuTableBody">
                        <!-- Data will be populated here via JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Menu Item</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="itemForm" onsubmit="saveItem(event)">
                    <input type="hidden" id="itemId">
                    
                    <div class="form-group">
                        <label for="itemName">Item Name</label>
                        <input type="text" id="itemName" required class="form-input" placeholder="e.g. Paneer Tikka">
                    </div>
                    
                    <div class="form-group">
                        <label for="itemCategory">Category</label>
                        <select id="itemCategory" required class="form-select">
                            <option value="STARTER">Starter</option>
                            <option value="MAIN_COURSE">Main Course</option>
                            <option value="DESSERT">Dessert</option>
                            <option value="BEVERAGE">Beverage</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="itemPrice">Price (₹)</label>
                        <input type="number" id="itemPrice" required min="1" step="0.01" class="form-input" placeholder="e.g. 250.00">
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="itemAvailable" checked>
                        <label for="itemAvailable">Is Available?</label>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/menu.js"></script>
</body>
</html>
