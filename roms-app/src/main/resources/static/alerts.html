<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ROMS — View and manage system alerts for out-of-stock items and stale orders.">
    <title>ROMS — Alerts</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <!-- App CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Navbar ────────────────────────────────────────────────── -->
<nav class="navbar">
    <div class="navbar-inner">
        <a href="index.html" class="navbar-brand">
            <div class="logo-icon">R</div>
            <span>ROMS</span>
            <span class="brand-sub">Restaurant Orders</span>
        </a>
        <ul class="navbar-links">
            <li><a href="index.html">Menu</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="alerts.html" class="active">Alerts <span id="navAlertBadge" class="status-badge status-unavailable" style="font-size:0.6rem; padding:2px 6px; margin-left:4px; display:none;">0</span></a></li>
        </ul>
        <a href="orders.html" class="navbar-cta">+ New Order</a>
    </div>
</nav>

<!-- ── Page Content ─────────────────────────────────────────── -->
<div class="container">
    <div class="page-content">

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <div class="badge-label"><span class="badge-dot"></span> EXCEPTION ALERTS</div>
                <h1>System <em>Alerts</em></h1>
                <p class="page-subtitle">Monitor out-of-stock warnings and stale order notifications.</p>
            </div>
        </div>

        <!-- Stat Cards -->
        <div class="stats-grid fade-in" style="grid-template-columns: repeat(3, 1fr);">
            <div class="stat-card" style="border-top: 3px solid var(--danger)">
                <div class="stat-label">Active Alerts</div>
                <div class="stat-value" id="stat-active">—</div>
                <div class="stat-sub">unresolved</div>
            </div>
            <div class="stat-card" style="border-top: 3px solid var(--accent-amber)">
                <div class="stat-label">Out of Stock</div>
                <div class="stat-value" id="stat-oos">—</div>
                <div class="stat-sub">items unavailable</div>
            </div>
            <div class="stat-card" style="border-top: 3px solid var(--status-preparing)">
                <div class="stat-label">Stale Orders</div>
                <div class="stat-value" id="stat-stale">—</div>
                <div class="stat-sub">pending too long</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-bar fade-in fade-in-delay-1">
            <div class="tab-pills">
                <button class="tab-pill active" onclick="setAlertFilter('active', this)">Active</button>
                <button class="tab-pill" onclick="setAlertFilter('all', this)">All</button>
            </div>
        </div>

        <!-- Alerts List -->
        <div id="alertsList" class="fade-in fade-in-delay-2">
            <!-- Populated via JavaScript -->
        </div>

    </div>
</div>

<script src="js/alerts.js"></script>
</body>
</html>
